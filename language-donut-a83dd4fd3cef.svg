    <text class="percent" x="183.0" y="130.5" text-anchor="end">3.2%</text>
    <rect class="bar-track" x="44.0" y="139.5" width="139.0" height="3" rx="1.5"/>
    <rect x="44.0" y="139.5" width="4.43" height="3" rx="1.5" fill="#00B8D9"/>
