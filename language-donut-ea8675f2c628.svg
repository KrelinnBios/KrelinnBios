     .bar-track { fill: #d0d7de; opacity: 0.34; }
     .donut-track { fill: #d0d7de; opacity: 0.20; }
     .segment { stroke: none; }
     @media (prefers-color-scheme: dark) {
       .label, .center-value, .center-label { fill: #f0f6fc; }
